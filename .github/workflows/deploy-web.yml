name: Publish InstaPlan web app

on:
  push:
    branches: [setup-pwa]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare web app
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest icon.svg sw.js _site/
          cp -R assets _site/assets 2>/dev/null || true
          cp -R scripts _site/scripts 2>/dev/null || true
          test -s _site/index.html
          test -s _site/manifest.webmanifest

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
